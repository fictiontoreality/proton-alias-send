[project]
name = "proton-alias-send"
dynamic = ["version"]
description = "Create Proton Pass / SimpleLogin reverse aliases from the command line"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["simplelogin", "proton", "proton-pass", "alias", "email", "privacy", "cli"]
authors = [{ name = "Jesse Johnson", email = "gpg@fictiontoreality.dev" }]
dependencies = []

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/fictiontoreality/proton-alias-send"
Repository = "https://github.com/fictiontoreality/proton-alias-send"
Issues = "https://github.com/fictiontoreality/proton-alias-send/issues"
Changelog = "https://github.com/fictiontoreality/proton-alias-send/blob/main/CHANGELOG.md"

[project.scripts]
proton-alias-send = "proton_alias_send.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/proton_alias_send/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/proton_alias_send"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CHANGELOG.md"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

# Test helpers take pytest fixtures and monkeypatched stand-ins; demanding full
# annotations on every one of them costs more than it catches.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
