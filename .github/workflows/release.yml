name: Release

# Publishes to PyPI when a version tag is pushed, once CI has passed.
#
# Uses PyPI Trusted Publishing - no API token secret required. Before the first
# release, add a pending publisher at
# https://pypi.org/manage/account/publishing/ for project `proton-alias-send`,
# this repository, workflow `release.yml`, environment `pypi`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run python -c 'import proton_alias_send as p; print(p.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match __version__ $version" >&2
            exit 1
          fi

      - run: uv build
      - run: uvx twine check dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
